name: Flatpak

on:
  push:
    branches: [ master, main ]
    paths:
      - 'flatpak/**'
      - 'PiMusicPlayerTray-linux/**'
      - '.github/workflows/flatpak.yml'
  pull_request:
    paths:
      - 'flatpak/**'
      - 'PiMusicPlayerTray-linux/**'
      - '.github/workflows/flatpak.yml'
  workflow_dispatch:

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: PiMusicPlayerTray.flatpak
          manifest-path: flatpak/org.drakarah.PiMusicPlayerTray.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Publish latest Flatpak release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2.0.7
        with:
          tag_name: latest
          name: Latest Flatpak build
          target_commitish: ${{ github.sha }}
          body: Latest successful Flatpak build from the default branch.
          make_latest: true
          files: PiMusicPlayerTray.flatpak
