[General]
PlayerUrl = http://localhost:5000/
Version = 2
PopupChange = true
WaitTicksOnAutoPopup = 100
FormWidth = 400
FormHeight = 520

[Hotkeys]
; Modifiers: ctrl, alt, shift, super (windows key). Combine with '+'.
; Special keys (e.g. function keys) are written as their name, e.g. f5.
PlayPause = ctrl+alt+k
Stop = ctrl+alt+n
Next = ctrl+alt+m
Previous = ctrl+alt+i
VolumeUp = ctrl+alt+o
VolumeDown = ctrl+alt+l
Refresh = ctrl+alt+f5
Show = ctrl+alt+u
